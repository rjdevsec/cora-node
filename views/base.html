<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Assessment{% endblock %} · CORA</title>
  <link rel="icon" type="image/svg+xml" href="{{ url('static', {filename: 'cora-logo.svg'}) }}">
  <link rel="stylesheet" href="{{ url('static', {filename: 'app.css'}) }}">
  <script src="{{ url('static', {filename: 'app.js'}) }}"></script>
  <script src="{{ url('static', {filename: 'htmx.min.js'}) }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token() }}"}'>
{% set ep = endpoint or '' %}
<div class="shell">
  <aside class="sidebar">
    <a class="brand" href="{{ url('start') }}" aria-label="CORA home">
      <img class="logo" src="{{ url('static', {filename: 'cora-logo.svg'}) }}" alt="" width="34" height="34">
      <span class="wordmark">CORA</span>
    </a>
    <div>
      <div class="nav-label">Assess</div>
      <nav class="nav">
        <a href="{{ url('start') }}" class="{{ 'active' if ep == 'start' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>New assessment</a>
        <a href="{{ url('runs') }}" class="{{ 'active' if ep in ['runs', 'run'] }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/></svg>Assessment runs</a>
      </nav>
    </div>
    {% if can('manage') %}<div>
      <div class="nav-label">Configure</div>
      <nav class="nav">
        <a href="{{ url('data_sources') }}" class="{{ 'active' if ep in ['data_sources', 'mapping'] }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Data sources</a>
        <a href="{{ url('settings_page') }}" class="{{ 'active' if ep == 'settings_page' }}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Rules &amp; thresholds</a>
      </nav>
    </div>{% endif %}
    <div class="sidebar-foot">
      <button type="button" class="theme-toggle" id="theme-toggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
        <span id="theme-label">Dark mode</span></button>
      <span class="phase-chip">Local pilot · Phase 2</span>
    </div>
  </aside>
  <div class="content">
    <main>
      {% for item in flashes() %}<div class="flash {{ item[0] if item[0] in ['success', 'error'] else 'info' }}">{{ item[1] }}</div>{% endfor %}
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
